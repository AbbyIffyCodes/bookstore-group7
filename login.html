<!DOCTYPE html>
<head>
	<title>Login - BookShop</title>
	<style>
		html, body {
			width: 100%;
			height: 100vh;
			margin: 0;
			padding: 0;
			background-color: #ffffff;
			
		}
		#page_wrapper {
			width: 100%;
			height: 100vh;
			border-collapse: collapse;
		}
		#login_table {
			border-collapse: collapse;
		}
		#left_box {
			width: 400px;
			height: 320px;
			background-color: #ececec;
			text-align: center;
			vertical-align: middle;
			padding: 20px;
		}
		#right_box {
			width: 320px;
			height: 320px;
			vertical-align: top;
			padding-left: 50px;
		}
		h2 {
			margin-top: 0;
			margin-bottom: 20px;
			font-size: 26px;
			font-weight: normal;
			color: #000000;
		}
		label {
			font-size: 13px;
			color: #333333;
		}
		input[type="email"], input[type="password"] {
			width: 100%;
			height: 40px;
			background-color: #e6e1e1;
			border: none;
			margin-top: 5px;
			margin-bottom: 15px;
			padding: 0 10px;
			box-sizing: border-box;
			font-size: 14px;
		}
		input[type="email"]:focus, input[type="password"]:focus {
			background-color: #d8d3d3;
			outline: none;
		}
		#forgot_link {
			display: block;
			text-align: right;
			font-size: 12px;
			color: #333333;
			text-decoration: none;
			margin-top: -10px;
			margin-bottom: 25px;
		}
		button {
			width: 100%;
			height: 45px;
			background-color: #4c63ee;
			color: white;
			border: none;
			font-size: 16px;
			cursor: pointer;
			margin-bottom: 20px;
			border-radius: 4px;
		}
		button:hover {
			background-color: #3b50cb;
		}
		#signup_text {
			text-align: center;
			font-size: 13px;
			color: #333333;
		}
		#signup_text a {
			color: #4c63ee;
			text-decoration: none;
			font-weight: bold;
		}
	</style>
</head>
<body>

	<table id="page_wrapper">
		<tr>
			<td align="center" align="middle">

				<form action="admin_dashboard.html" method="POST">
					<table id="login_table">
						<tr>
							<td id="left_box">
								<img src="ONLINE_BOOKSHOP_LOGO.jpg" alt="BookShop Logo" width="180">
							</td>
							<td id="right_box">
								<h2>Login</h2>

								<label>Email</label><br>
								<input type="email" name="EmailAdd" id="EmailAdd" required><br>

								<label>Password</label><br>
								<input type="password" name="Pass" id="Pass" required><br>
								<a href="forgot_password.html" id="forgot_link">Forgot Password?</a>

								<button type="submit">Login</button>

								<div id="signup_text">
									Don't have an account? <a href="signup.html">Sign up</a>
								</div>
							</td>
						</tr>
					</table>
				</form>

			</td>
		</tr>
	</table>

</body>
</html>
