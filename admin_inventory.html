<!DOCTYPE html>
<head>
	<title>Manage Books & Inventory - BookShop</title>
	<style>
		html, body {
			height: 100%;
			margin: 0;
			padding: 0;
			background-color: lightblue;
		}
		#header_table {
			width: 100%;
			height: 50px;
			background-color: blue;
			color: white;
			padding: 0 20px;
		}
		#main_layout {
			width: 100%;
			height: calc(100vh - 50px);
			border-collapse: collapse;
		}
		#sidebar {
			width: 220px;
			vertical-align: top;
			background-color: #4c63ee;
			padding-top: 10px;
		}
		#sidebar a {
			display: block;
			color: white;
			text-decoration: none;
			font-weight: bold;
			padding: 12px 20px;
		}
		#active_menu {
			background-color: grey;
		}
		#content {
			vertical-align: top;
			padding: 20px;
		}
		fieldset {
			border-color: blue;
			background-color: white;
			margin-bottom: 20px;
			padding: 15px;
		}
		.logout-btn {
			background-color: grey;
			color: white;
			padding: 10px 20px;
			border: none;
			cursor: pointer;
			font-weight: bold;
			width: 100%;
		}
		.blue-btn {
			background-color: blue;
			color: white;
			border: none;
			padding: 6px 12px;
			cursor: pointer;
			font-weight: bold;
		}
		.action-btn {
			background-color: blue;
			color: white;
			border: none;
			padding: 4px 8px;
			margin: 0 2px;
			cursor: pointer;
			font-weight: bold;
			font-size: 11px;
		}
		#inventory_table {
			width: 100%;
			border-collapse: collapse;
		}
		#inventory_table th {
			background-color: #5d83e1;
			color: white;
			padding: 12px;
		}
		#inventory_table td {
			background-color: #5911eb;
			color: white;
			padding: 12px;
			text-align: center;
			font-weight: bold;
		}
	</style>
</head>
<body>

	<table id="header_table">
		<tr>
			<td>
				<img src="ONLINE_BOOKSHOP_LOGO.jpg" alt="Logo" height="30" align="middle">
				<b>BOOKSHOP MANAGEMENT</b>
			</td>
			<td align="right"><b>ADMIN PANEL</b></td>
		</tr>
	</table>

	<table id="main_layout">
		<tr>
			<td id="sidebar">
				<a href="admin_dashboard.html">DASHBOARD</a>
				<a href="admin_inventory.html" id="active_menu">BOOKS & INVENTORY</a>
				<a href="admin_users.html">USERS</a>
				<a href="profile_settings.html">SETTINGS</a>
				<a href="#">ANALYTICS</a>
				<br><br>
				<div style="padding: 0 20px;">
					<a href="login.html" style="padding: 0;"><button type="button" class="logout-btn">LOG OUT</button></a>
				</div>
			</td>
			<td id="content">
				<fieldset>
					<legend>Manage Books & Inventory</legend>
					
					<table width="100%" style="margin-bottom: 15px;">
						<tr>
							<td>
								<input type="text" placeholder="SEARCH BOOKS" style="padding: 5px;">
								<button type="button" class="blue-btn">SEARCH</button>
							</td>
							<td align="right">
								<button type="button" class="blue-btn">ADD NEW BOOK</button>
							</td>
						</tr>
					</table>

					<table id="inventory_table" border="1">
						<tr>
							<th>ID</th>
							<th>DETAILS</th>
							<th>STOCK</th>
							<th>PRICE</th>
							<th>ACTION</th>
						</tr>
						<tr>
							<td>TXN1001</td>
							<td>THE ALCHEMIST</td>
							<td>15</td>
							<td>BDT 450</td>
							<td>
								<button type="button" class="action-btn">EDIT</button>
								<button type="button" class="action-btn">DELETE</button>
							</td>
						</tr>
						<tr>
							<td>TXN1002</td>
							<td>ATOMIC HABITS</td>
							<td>27</td>
							<td>BDT 520</td>
							<td>
								<button type="button" class="action-btn">EDIT</button>
								<button type="button" class="action-btn">DELETE</button>
							</td>
						</tr>
						<tr>
							<td>TXN1003</td>
							<td>A Song of Ice and Fire</td>
							<td>35</td>
							<td>BDT 2225</td>
							<td>
								<button type="button" class="action-btn">EDIT</button>
								<button type="button" class="action-btn">DELETE</button>
							</td>
						</tr>
						<tr>
							<td>TXN1004</td>
							<td>RICH DAD POOR DAD</td>
							<td>09</td>
							<td>BDT 570</td>
							<td>
								<button type="button" class="action-btn">EDIT</button>
								<button type="button" class="action-btn">DELETE</button>
							</td>
						</tr>
					</table>
				</fieldset>
			</td>
		</tr>
	</table>

</body>
</html>
