<!DOCTYPE html>
<head>
	<title>Forgot Password - BookShop</title>
	<style>
		html, body {
			width: 100%;
			height: 100vh;
			margin: 0;
			padding: 0;
			background-color: #ffffff;
		}
		#page_wrapper {
			width: 100%;
			height: 100vh;
			border-collapse: collapse;
		}
		#forgot_table {
			border-collapse: collapse;
		}
		#form_box {
			width: 360px;
			vertical-align: top;
			padding: 20px;
		}
		h2 {
			margin-top: 0;
			margin-bottom: 20px;
			font-size: 26px;
			font-weight: normal;
			color: #000000;
		}
		label {
			font-size: 13px;
			color: #333333;
		}
		input[type="email"], input[type="password"] {
			width: 100%;
			height: 40px;
			background-color: #e6e1e1;
			border: none;
			margin-top: 5px;
			margin-bottom: 12px;
			padding: 0 10px;
			box-sizing: border-box;
			font-size: 14px;
		}
		input[type="email"]:focus, input[type="password"]:focus {
			background-color: #d8d3d3;
			outline: none;
		}
		button {
			width: 100%;
			height: 45px;
			background-color: #4c63ee;
			color: white;
			border: none;
			font-size: 16px;
			cursor: pointer;
			margin-top: 10px;
			margin-bottom: 20px;
			border-radius: 4px;
		}
		button:hover {
			background-color: #3b50cb;
		}
		#login_text {
			text-align: center;
			font-size: 13px;
			color: #333333;
		}
		#login_text a {
			color: #4c63ee;
			text-decoration: none;
			font-weight: bold;
		}

		
		#alert_msg {
			display: none;
			background-color: #d4edda;
			color: #155724;
			border: 1px solid #c3e6cb;
			padding: 10px;
			border-radius: 4px;
			font-size: 13px;
			margin-bottom: 15px;
			text-align: center;
			font-weight: bold;
		}
		#alert_msg:target {
			display: block;
		}
	</style>
</head>
<body>

	<table id="page_wrapper">
		<tr>
			<td align="center" align="middle">

				<form action="#alert_msg" method="GET">
					<table id="forgot_table">
						<tr>
							<td id="form_box">
								<h2>Reset Password</h2>

								<div id="alert_msg">
									Password updated
								</div>

								<label>Email</label><br>
								<input type="email" name="EmailAdd" id="EmailAdd" required><br>

								<label>Current Password</label><br>
								<input type="password" name="CurPass" id="CurPass" required><br>

								<label>New Password</label><br>
								<input type="password" name="Pass" id="Pass" required><br>

								<label>Confirm New Password</label><br>
								<input type="password" name="CPass" id="CPass" required><br>

								<button type="submit">Submit</button>

								<div id="login_text">
									Remembered your password? <a href="login.html">Login</a>
								</div>
							</td>
						</tr>
					</table>
				</form>

			</td>
		</tr>
	</table>

</body>
</html>
